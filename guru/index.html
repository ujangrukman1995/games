<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Halaman Guru: CorelDRAW Arena 3D</title>
<style>
:root{--bg:#f4f6fb;--pn:#fff;--tx:#1b2233;--bd:#d3dbea;--ac:#1a9e4b}@media(prefers-color-scheme:dark){:root{--bg:#0e1424;--pn:#192138;--tx:#eef2ff;--bd:#2b3654}}
body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}h1{margin:0 0 10px;font-size:20px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}input,select,button{padding:9px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--pn);color:var(--tx);font:inherit}button{cursor:pointer;background:var(--ac);color:#fff;border:0}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;background:var(--pn)}th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{cursor:pointer}tr.r:hover{background:#1a9e4b22;cursor:pointer}
#dt{margin-top:14px;background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:12px}#dt:empty{display:none}.ok{color:#2e7d32}.no{color:#c62828}
</style></head><body><h1>📋 Hasil Siswa: CorelDRAW Arena 3D</h1>
<div class="bar"><input id="f" placeholder="Cari nama…"><select id="k"><option value="">Semua kelas</option></select><button onclick="load()">↻ Muat ulang</button><button onclick="csv()">⬇ Unduh CSV</button><span id="i"></span></div>
<div class="w"><table><thead><tr><th onclick="so('n')">Nama</th><th onclick="so('k')">Kelas</th><th onclick="so('st')">Stasiun</th><th onclick="so('sk')">Skor</th><th onclick="so('pa')">Materi A</th><th onclick="so('pb')">Materi B</th><th>Ujian Akhir</th><th onclick="so('w')">Terakhir</th></tr></thead><tbody id="tb"></tbody></table></div><div id="dt"></div>
<script>
let D=[],sk='w',sd=-1;const $=s=>document.getElementById(s),pc=a=>a&&a[1]?Math.round(a[0]/a[1]*100):0,esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){$('i').textContent='Memuat…';try{const r=await fetch('/guru/api/results',{cache:'no-store'});if(!r.ok)throw 0;D=(await r.json()).map(x=>({...x,pa:pc(x.A),pb:pc(x.B)}));$('i').textContent=D.length+' percobaan';const ks=[...new Set(D.map(x=>x.k).filter(Boolean))].sort();$('k').innerHTML='<option value="">Semua kelas</option>'+ks.map(k=>`<option>${esc(k)}</option>`).join('');draw()}catch(e){$('i').textContent='Gagal memuat data.'}}
function so(k){sd=sk==k?-sd:(k=='n'||k=='k'?1:-1);sk=k;draw()}
function rows(){const f=$('f').value.toLowerCase(),k=$('k').value;return D.filter(x=>(!f||(x.n||'').toLowerCase().includes(f))&&(!k||x.k==k)).sort((a,b)=>(a[sk]>b[sk]?1:-1)*sd)}
function draw(){$('tb').innerHTML=rows().map(x=>`<tr class="r" onclick="det('${x.id}')"><td>${esc(x.n)}</td><td>${esc(x.k)}</td><td>${x.st}/8</td><td>${x.sk}</td><td>${x.pa}%</td><td>${x.pb}%</td><td>${x.fi?'✅ selesai':'—'}</td><td>${new Date(x.w).toLocaleString('id-ID')}</td></tr>`).join('')}
async function det(id){$('dt').innerHTML='Memuat…';const r=await (await fetch('/guru/api/detail?id='+id,{cache:'no-store'})).json();if(!r)return $('dt').textContent='Data tidak ditemukan.';
$('dt').innerHTML=`<b>${esc(r.nama)}</b> (${esc(r.kelas)}) · Skor ${r.skor} · Stasiun ${r.stasiun}/8 · Nyawa ${r.nyawa}<br>Materi A ${pc(r.A)}% · Materi B ${pc(r.B)}%<h3>Jawaban per soal (benar pada percobaan pertama = ✔)</h3><ol>${r.log.map(l=>`<li class="${l.ok?'ok':'no'}">${l.ok?'✔':'✘'} [${l.s<4||l.s==9?'A':'B'}] ${esc(l.q)} <small>(percobaan: ${l.tr+(l.ok?1:0)})</small></li>`).join('')}</ol>`;$('dt').scrollIntoView()}
function csv(){const h='Nama,Kelas,Stasiun,Skor,MateriA%,MateriB%,Selesai,Waktu',q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';const t=[h,...rows().map(x=>[q(x.n),q(x.k),x.st,x.sk,x.pa,x.pb,x.fi?'ya':'tidak',q(new Date(x.w).toISOString())].join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='hasil-siswa.csv';a.click()}
$('f').oninput=draw;$('k').onchange=draw;load();
</script></body></html>
